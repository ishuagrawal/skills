name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agent Skills spec check
        run: python3 scripts/check_skills.py
      - name: Claude Code plugin + marketplace check
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      - name: Package zips
        run: ./scripts/package_skills.sh
